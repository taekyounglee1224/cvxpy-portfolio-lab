<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 372" width="960" height="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6570"/>
    </marker>
    <marker id="arrowGrad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B23A48"/>
    </marker>
  </defs>

  <rect width="960" height="372" fill="#FFFFFF"/>

  <!-- ── stage bands ── -->
  <rect x="24" y="44" width="486" height="118" rx="10" fill="#0B6E8F" opacity="0.05"/>
  <text x="34" y="66" font-size="11.5" font-weight="600" fill="#0B6E8F" letter-spacing="0.6">PREDICTION</text>

  <rect x="530" y="44" width="406" height="118" rx="10" fill="#E07A3F" opacity="0.06"/>
  <text x="540" y="66" font-size="11.5" font-weight="600" fill="#C2622C" letter-spacing="0.6">DECISION</text>

  <!-- ══ forward pass ══ -->
  <!-- 1. input -->
  <rect x="40" y="80" width="140" height="66" rx="8" fill="#FFFFFF" stroke="#0B6E8F" stroke-width="1.6"/>
  <text x="110" y="106" font-size="13.5" font-weight="600" text-anchor="middle" fill="#123">Returns window</text>
  <text x="110" y="126" font-size="12" text-anchor="middle" fill="#5B6570">LOOKBACK × m</text>

  <line x1="184" y1="113" x2="214" y2="113" stroke="#5B6570" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 2. MLP -->
  <rect x="218" y="80" width="116" height="66" rx="8" fill="#0B6E8F" stroke="#0B6E8F" stroke-width="1.6"/>
  <text x="276" y="106" font-size="13.5" font-weight="600" text-anchor="middle" fill="#FFFFFF">MLP</text>
  <text x="276" y="126" font-size="12" text-anchor="middle" fill="#CFE6EE">3 layers</text>

  <line x1="338" y1="113" x2="368" y2="113" stroke="#5B6570" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 3. predicted path -->
  <rect x="372" y="80" width="126" height="66" rx="8" fill="#FFFFFF" stroke="#0B6E8F" stroke-width="1.6"/>
  <text x="435" y="105" font-size="13.5" font-weight="600" text-anchor="middle" fill="#123">Ŷ  ∈  ℝ<tspan font-size="9.5" dy="-5">N×m</tspan></text>
  <text x="435" y="125" font-size="12" text-anchor="middle" fill="#5B6570">cumulative path</text>

  <line x1="502" y1="113" x2="542" y2="113" stroke="#5B6570" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 4. optimization layer -->
  <rect x="546" y="76" width="188" height="74" rx="8" fill="#E07A3F" stroke="#C2622C" stroke-width="1.6"/>
  <text x="640" y="101" font-size="13.5" font-weight="600" text-anchor="middle" fill="#FFFFFF">CVXPY layer</text>
  <text x="640" y="120" font-size="11.5" text-anchor="middle" fill="#FCEBDF">drawdown-constrained</text>
  <text x="640" y="137" font-size="11.5" text-anchor="middle" fill="#FCEBDF">differentiable QP</text>

  <line x1="738" y1="113" x2="768" y2="113" stroke="#5B6570" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 5. weights -->
  <rect x="772" y="80" width="126" height="66" rx="8" fill="#FFFFFF" stroke="#C2622C" stroke-width="1.6"/>
  <text x="835" y="106" font-size="13.5" font-weight="600" text-anchor="middle" fill="#123">Portfolio  x</text>
  <text x="835" y="126" font-size="12" text-anchor="middle" fill="#5B6570">weights</text>

  <!-- ══ evaluation ══ -->
  <line x1="835" y1="150" x2="835" y2="204" stroke="#5B6570" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="772" y="208" width="126" height="58" rx="8" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.6"/>
  <text x="835" y="232" font-size="12.5" font-weight="600" text-anchor="middle" fill="#123">Realized</text>
  <text x="835" y="250" font-size="12.5" font-weight="600" text-anchor="middle" fill="#123">returns</text>

  <line x1="768" y1="237" x2="716" y2="237" stroke="#5B6570" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- loss -->
  <rect x="374" y="206" width="338" height="62" rx="8" fill="#FFFFFF" stroke="#B23A48" stroke-width="1.8"/>
  <text x="543" y="230" font-size="12.5" font-weight="600" text-anchor="middle" fill="#B23A48">Decision loss</text>
  <text x="543" y="252" font-size="14" text-anchor="middle" fill="#123">ℒ = λ·(−Sharpe) + (1−λ)·MDD</text>

  <!-- ══ backprop ══ -->
  <path d="M 374 237 L 276 237 L 276 152" fill="none" stroke="#B23A48" stroke-width="1.8"
        stroke-dasharray="6 4" marker-end="url(#arrowGrad)"/>
  <text x="290" y="199" font-size="12" font-weight="600" fill="#B23A48">∇ℒ</text>
  <text x="290" y="216" font-size="11.5" fill="#B23A48">through the layer</text>

  <!-- caption -->
  <text x="480" y="316" font-size="12.5" text-anchor="middle" fill="#5B6570">
    Gradients of the portfolio outcome flow back through the optimization layer,
  </text>
  <text x="480" y="336" font-size="12.5" text-anchor="middle" fill="#5B6570">
    so the predictor is trained for the decision it produces — not for forecast accuracy.
  </text>
</svg>
